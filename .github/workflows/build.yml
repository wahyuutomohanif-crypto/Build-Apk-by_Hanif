name: Build APK
on: { workflow_dispatch: {} }
jobs: { build: { runs-on: ubuntu-latest, defaults: { run: { working-directory: ./add_to_app/flutter_module } }, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-java@v4, with: { distribution: 'zulu', java-version: '17' } }, { uses: subosito/flutter-action@v2, with: { channel: 'stable' } }, { run: flutter pub get }, { run: flutter build apk }, { uses: actions/upload-artifact@v4, with: { name: apk, path: add_to_app/flutter_module/build/app/outputs/flutter-apk/app-release.apk } } ] } }
